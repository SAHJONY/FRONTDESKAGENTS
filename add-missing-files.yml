name: Add missing files and fix build

# Run this manually from the repo's "Actions" tab → "Add missing files and fix build" → "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Write the three missing source files
        run: |
          mkdir -p frontdesk-agents/src/components frontdesk-agents/src/lib
          echo '' | base64 -d > frontdesk-agents/src/components/ToastProvider.tsx
          echo '' | base64 -d > frontdesk-agents/src/components/SendInvoiceDialog.tsx
          echo '' | base64 -d > frontdesk-agents/src/lib/export-utils.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontdesk-agents/src/components/ToastProvider.tsx \
                  frontdesk-agents/src/components/SendInvoiceDialog.tsx \
                  frontdesk-agents/src/lib/export-utils.ts
          if git diff --cached --quiet; then
            echo "Files already present - nothing to commit."
          else
            git commit -m "Add missing ToastProvider, SendInvoiceDialog, export-utils"
            git push
          fi
